<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 400" width="880" height="400" role="img" aria-label="Diagram: three ways graphs break. Context collapse when too many outputs are poured into one final step, false independence when two nodes write the same file, and silent node failure when a dead node is missing from a report that still looks complete.">
  <rect x="0" y="0" width="880" height="400" rx="14" fill="#FBF7F0"/>
  <rect x="0.75" y="0.75" width="878.5" height="398.5" rx="13.5" fill="none" stroke="#E5DDD0" stroke-width="1.5"/>

  <text x="40" y="52" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="24" font-weight="700" fill="#1C2B33">Where Graphs Break</text>
  <rect x="40" y="64" width="64" height="4" rx="2" fill="#D97740"/>
  <text x="40" y="92" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#5B6B75">All three fail quietly. That is what makes them expensive.</text>

  <rect x="40" y="112" width="240" height="252" rx="12" fill="#FFFFFF" stroke="#E5DDD0" stroke-width="1.5"/>
  <circle cx="70" cy="146" r="15" fill="#F7E7E5"/>
  <text x="70" y="151" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#B4483C">1</text>
  <text x="95" y="151" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#1C2B33">Context collapse</text>
  <circle cx="72" cy="188" r="5" fill="#D97740" opacity="0.7"/>
  <circle cx="106" cy="188" r="5" fill="#D97740" opacity="0.7"/>
  <circle cx="140" cy="188" r="5" fill="#D97740" opacity="0.7"/>
  <circle cx="174" cy="188" r="5" fill="#D97740" opacity="0.7"/>
  <circle cx="208" cy="188" r="5" fill="#D97740" opacity="0.7"/>
  <circle cx="242" cy="188" r="5" fill="#D97740" opacity="0.7"/>
  <path d="M 72 195 L 152 218 M 106 195 L 152 218 M 140 195 L 152 218 M 174 195 L 152 218 M 208 195 L 152 218 M 242 195 L 152 218" stroke="#CFC5B4" stroke-width="1.2" fill="none"/>
  <rect x="118" y="220" width="70" height="22" rx="5" fill="#F7E7E5" stroke="#B4483C" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="153" y="235" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="10" font-weight="600" fill="#B4483C">overflow</text>
  <text x="64" y="274" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="10" font-weight="700" letter-spacing="1.2" fill="#D97740">THE FIX</text>
  <text x="64" y="296" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12.5" fill="#1C2B33">Layer the fan-in. Summarize</text>
  <text x="64" y="315" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12.5" fill="#1C2B33">in batches, then combine the</text>
  <text x="64" y="334" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12.5" fill="#1C2B33">summaries. Never the raw pile.</text>

  <rect x="320" y="112" width="240" height="252" rx="12" fill="#FFFFFF" stroke="#E5DDD0" stroke-width="1.5"/>
  <circle cx="350" cy="146" r="15" fill="#F7E7E5"/>
  <text x="350" y="151" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#B4483C">2</text>
  <text x="375" y="151" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#1C2B33">False independence</text>
  <rect x="346" y="180" width="80" height="26" rx="5" fill="#FFFFFF" stroke="#D97740" stroke-width="1.4"/>
  <text x="386" y="197" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" fill="#1C2B33">agent 1</text>
  <rect x="454" y="180" width="80" height="26" rx="5" fill="#FFFFFF" stroke="#D97740" stroke-width="1.4"/>
  <text x="494" y="197" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" fill="#1C2B33">agent 2</text>
  <path d="M 386 206 L 425 224 M 494 206 L 455 224" stroke="#CFC5B4" stroke-width="1.4" fill="none"/>
  <rect x="395" y="226" width="90" height="24" rx="5" fill="#F7E7E5" stroke="#B4483C" stroke-width="1.5"/>
  <text x="440" y="242" text-anchor="middle" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="10" font-weight="600" fill="#B4483C">same file</text>
  <text x="344" y="274" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="10" font-weight="700" letter-spacing="1.2" fill="#D97740">THE FIX</text>
  <text x="344" y="296" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12.5" fill="#1C2B33">Give each writer its own</text>
  <text x="344" y="315" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12.5" fill="#1C2B33">worktree. Audit for shared</text>
  <text x="344" y="334" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12.5" fill="#1C2B33">resources, not just shared data.</text>

  <rect x="600" y="112" width="240" height="252" rx="12" fill="#FFFFFF" stroke="#E5DDD0" stroke-width="1.5"/>
  <circle cx="630" cy="146" r="15" fill="#F7E7E5"/>
  <text x="630" y="151" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#B4483C">3</text>
  <text x="655" y="151" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#1C2B33">Silent node failure</text>
  <circle cx="632" cy="190" r="7" fill="#D97740" opacity="0.75"/>
  <circle cx="666" cy="190" r="7" fill="#D97740" opacity="0.75"/>
  <circle cx="700" cy="190" r="7" fill="#FBF7F0" stroke="#B4483C" stroke-width="1.5" stroke-dasharray="3 2"/>
  <circle cx="734" cy="190" r="7" fill="#D97740" opacity="0.75"/>
  <circle cx="768" cy="190" r="7" fill="#D97740" opacity="0.75"/>
  <circle cx="802" cy="190" r="7" fill="#D97740" opacity="0.75"/>
  <text x="700" y="216" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="10" fill="#B4483C">died</text>
  <rect x="624" y="226" width="192" height="24" rx="5" fill="#F4EFE6" stroke="#CFC5B4" stroke-width="1.4"/>
  <text x="720" y="242" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="10.5" fill="#6B5F4E">report reads as complete</text>
  <text x="624" y="274" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="10" font-weight="700" letter-spacing="1.2" fill="#D97740">THE FIX</text>
  <text x="624" y="296" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12.5" fill="#1C2B33">Count what came back against</text>
  <text x="624" y="315" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12.5" fill="#1C2B33">what you sent. Flag the gap</text>
  <text x="624" y="334" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12.5" fill="#1C2B33">instead of shipping half a set.</text>
</svg>
