<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 340" width="880" height="340" role="img" aria-label="Diagram: a node is one agent doing one job with one input and one output. An edge is the arrow that carries one node's output into the next node's input.">
  <defs>
    <marker id="arrowAmber" viewBox="0 0 12 12" refX="9" refY="6" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 1 L 11 6 L 0 11 z" fill="#D97740"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="880" height="340" rx="14" fill="#FBF7F0"/>
  <rect x="0.75" y="0.75" width="878.5" height="338.5" rx="13.5" fill="none" stroke="#E5DDD0" stroke-width="1.5"/>

  <text x="40" y="52" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="24" font-weight="700" fill="#1C2B33">Nodes and Edges</text>
  <rect x="40" y="64" width="64" height="4" rx="2" fill="#D97740"/>
  <text x="40" y="92" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#5B6B75">The entire vocabulary. Nodes do the thinking. Edges carry the results.</text>

  <rect x="40" y="112" width="320" height="190" rx="12" fill="#FFFFFF" stroke="#E5DDD0" stroke-width="1.5"/>
  <text x="64" y="142" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" letter-spacing="2" fill="#D97740">NODE</text>
  <line x1="64" y1="154" x2="336" y2="154" stroke="#EFE8DC" stroke-width="1.5"/>

  <rect x="64" y="176" width="10" height="10" rx="2" fill="#D97740"/>
  <text x="88" y="186" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" fill="#1C2B33">one agent</text>
  <rect x="64" y="206" width="10" height="10" rx="2" fill="#D97740" opacity="0.8"/>
  <text x="88" y="216" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" fill="#1C2B33">one job, bounded</text>
  <rect x="64" y="236" width="10" height="10" rx="2" fill="#D97740" opacity="0.6"/>
  <text x="88" y="246" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" fill="#1C2B33">one input, passed in</text>
  <rect x="64" y="266" width="10" height="10" rx="2" fill="#D97740" opacity="0.4"/>
  <text x="88" y="276" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" fill="#1C2B33">one output, fixed shape</text>

  <rect x="430" y="155" width="140" height="76" rx="10" fill="#FFFFFF" stroke="#E5DDD0" stroke-width="1.5"/>
  <text x="500" y="188" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#1C2B33">Node A</text>
  <text x="500" y="209" text-anchor="middle" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="11" fill="#5B6B75">returns { price }</text>

  <rect x="690" y="155" width="140" height="76" rx="10" fill="#FFFFFF" stroke="#E5DDD0" stroke-width="1.5"/>
  <text x="760" y="188" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#1C2B33">Node B</text>
  <text x="760" y="209" text-anchor="middle" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="11" fill="#5B6B75">reads { price }</text>

  <line x1="578" y1="193" x2="678" y2="193" stroke="#D97740" stroke-width="2.5" marker-end="url(#arrowAmber)"/>
  <text x="628" y="172" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" letter-spacing="2" fill="#D97740">EDGE</text>

  <text x="630" y="264" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#5B6B75">One node's output feeds the next node's input.</text>
  <text x="630" y="284" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#1C2B33">If nothing crosses the arrow, there is no edge.</text>
</svg>
