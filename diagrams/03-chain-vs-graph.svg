<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 470" width="880" height="470" role="img" aria-label="Diagram: a linear chain of four steps run one after another, versus the same work redrawn as a graph where three independent audits run at the same time and feed one report.">
  <defs>
    <marker id="arrowInk" viewBox="0 0 12 12" refX="9" refY="6" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 1 L 11 6 L 0 11 z" fill="#8A97A0"/>
    </marker>
    <marker id="arrowAmber3" viewBox="0 0 12 12" refX="9" refY="6" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 1 L 11 6 L 0 11 z" fill="#D97740"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="880" height="470" rx="14" fill="#FBF7F0"/>
  <rect x="0.75" y="0.75" width="878.5" height="468.5" rx="13.5" fill="none" stroke="#E5DDD0" stroke-width="1.5"/>

  <text x="40" y="52" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="24" font-weight="700" fill="#1C2B33">Redrawing the Chain</text>
  <rect x="40" y="64" width="64" height="4" rx="2" fill="#D97740"/>
  <text x="40" y="92" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#5B6B75">Same four jobs. The only thing that changed is which ones were allowed to wait.</text>

  <line x1="440" y1="112" x2="440" y2="450" stroke="#EFE8DC" stroke-width="1.5"/>

  <text x="220" y="132" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" font-weight="700" letter-spacing="1.5" fill="#8A97A0">THE CHAIN YOU TYPED</text>

  <rect x="120" y="152" width="200" height="44" rx="9" fill="#FFFFFF" stroke="#E5DDD0" stroke-width="1.5"/>
  <text x="220" y="179" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#1C2B33">Audit demo site A</text>
  <line x1="220" y1="196" x2="220" y2="212" stroke="#8A97A0" stroke-width="2" marker-end="url(#arrowInk)"/>

  <rect x="120" y="218" width="200" height="44" rx="9" fill="#FFFFFF" stroke="#E5DDD0" stroke-width="1.5"/>
  <text x="220" y="245" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#1C2B33">Audit demo site B</text>
  <line x1="220" y1="262" x2="220" y2="278" stroke="#8A97A0" stroke-width="2" marker-end="url(#arrowInk)"/>

  <rect x="120" y="284" width="200" height="44" rx="9" fill="#FFFFFF" stroke="#E5DDD0" stroke-width="1.5"/>
  <text x="220" y="311" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#1C2B33">Audit demo site C</text>
  <line x1="220" y1="328" x2="220" y2="344" stroke="#8A97A0" stroke-width="2" marker-end="url(#arrowInk)"/>

  <rect x="120" y="350" width="200" height="44" rx="9" fill="#FFFFFF" stroke="#E5DDD0" stroke-width="1.5"/>
  <text x="220" y="377" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#1C2B33">Write the report</text>

  <rect x="110" y="416" width="220" height="32" rx="16" fill="#F7E7E5"/>
  <text x="220" y="437" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#B4483C">Four waits, added together</text>

  <text x="660" y="132" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" font-weight="700" letter-spacing="1.5" fill="#D97740">THE GRAPH IT WANTED TO BE</text>

  <rect x="474" y="152" width="112" height="60" rx="9" fill="#FFFFFF" stroke="#E5DDD0" stroke-width="1.5"/>
  <text x="530" y="178" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#1C2B33">Audit A</text>
  <text x="530" y="196" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" fill="#8A97A0">agent 1</text>

  <rect x="604" y="152" width="112" height="60" rx="9" fill="#FFFFFF" stroke="#E5DDD0" stroke-width="1.5"/>
  <text x="660" y="178" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#1C2B33">Audit B</text>
  <text x="660" y="196" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" fill="#8A97A0">agent 2</text>

  <rect x="734" y="152" width="112" height="60" rx="9" fill="#FFFFFF" stroke="#E5DDD0" stroke-width="1.5"/>
  <text x="790" y="178" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#1C2B33">Audit C</text>
  <text x="790" y="196" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" fill="#8A97A0">agent 3</text>

  <path d="M 530 212 L 530 246 Q 530 258 545 258 L 645 258" fill="none" stroke="#D97740" stroke-width="2"/>
  <path d="M 790 212 L 790 246 Q 790 258 775 258 L 675 258" fill="none" stroke="#D97740" stroke-width="2"/>
  <line x1="660" y1="212" x2="660" y2="286" stroke="#D97740" stroke-width="2" marker-end="url(#arrowAmber3)"/>
  <line x1="645" y1="258" x2="675" y2="258" stroke="#D97740" stroke-width="2"/>

  <rect x="560" y="292" width="200" height="44" rx="9" fill="#FFFFFF" stroke="#E5DDD0" stroke-width="1.5"/>
  <text x="660" y="319" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#1C2B33">Write the report</text>

  <line x1="660" y1="348" x2="660" y2="406" stroke="#4A7C59" stroke-width="1.5" stroke-dasharray="5 4"/>
  <line x1="652" y1="348" x2="668" y2="348" stroke="#4A7C59" stroke-width="1.5"/>
  <line x1="652" y1="406" x2="668" y2="406" stroke="#4A7C59" stroke-width="1.5"/>
  <text x="682" y="373" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#4A7C59">time you</text>
  <text x="682" y="390" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#4A7C59">get back</text>

  <rect x="550" y="416" width="220" height="32" rx="16" fill="#E8F0E9"/>
  <text x="660" y="437" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#4A7C59">One wait, the slowest one</text>
</svg>
