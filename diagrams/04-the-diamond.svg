<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 600" width="880" height="600" role="img" aria-label="Diagram: the diamond pattern. Split the job, fan out to four workers running at once, reduce the results in plain code, verify each survivor with three skeptics, then synthesize one answer.">
  <defs>
    <marker id="dArrow" viewBox="0 0 12 12" refX="9" refY="6" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 1 L 11 6 L 0 11 z" fill="#D97740"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="880" height="600" rx="14" fill="#FBF7F0"/>
  <rect x="0.75" y="0.75" width="878.5" height="598.5" rx="13.5" fill="none" stroke="#E5DDD0" stroke-width="1.5"/>

  <text x="40" y="52" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="24" font-weight="700" fill="#1C2B33">The Diamond</text>
  <rect x="40" y="64" width="64" height="4" rx="2" fill="#D97740"/>
  <text x="40" y="92" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#5B6B75">Fan out, reduce, verify, synthesize. Learn this one shape and you have most of the field.</text>

  <text x="150" y="215" text-anchor="end" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" font-weight="700" letter-spacing="1.2" fill="#8A97A0">1 · SPLIT</text>
  <rect x="390" y="190" width="230" height="48" rx="9" fill="#FFFFFF" stroke="#E5DDD0" stroke-width="1.5"/>
  <text x="505" y="219" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#1C2B33">Split the job into angles</text>

  <path d="M 505 238 L 505 250" fill="none" stroke="#D97740" stroke-width="2"/>
  <path d="M 242 250 L 768 250" fill="none" stroke="#D97740" stroke-width="2"/>
  <line x1="242" y1="250" x2="242" y2="268" stroke="#D97740" stroke-width="2" marker-end="url(#dArrow)"/>
  <line x1="417" y1="250" x2="417" y2="268" stroke="#D97740" stroke-width="2" marker-end="url(#dArrow)"/>
  <line x1="592" y1="250" x2="592" y2="268" stroke="#D97740" stroke-width="2" marker-end="url(#dArrow)"/>
  <line x1="768" y1="250" x2="768" y2="268" stroke="#D97740" stroke-width="2" marker-end="url(#dArrow)"/>

  <text x="150" y="303" text-anchor="end" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" font-weight="700" letter-spacing="1.2" fill="#D97740">2 · FAN OUT</text>
  <rect x="170" y="276" width="145" height="60" rx="9" fill="#FFFFFF" stroke="#D97740" stroke-width="1.5"/>
  <text x="242" y="303" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#1C2B33">Worker 1</text>
  <text x="242" y="322" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" fill="#8A97A0">own context</text>
  <rect x="345" y="276" width="145" height="60" rx="9" fill="#FFFFFF" stroke="#D97740" stroke-width="1.5"/>
  <text x="417" y="303" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#1C2B33">Worker 2</text>
  <text x="417" y="322" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" fill="#8A97A0">own context</text>
  <rect x="520" y="276" width="145" height="60" rx="9" fill="#FFFFFF" stroke="#D97740" stroke-width="1.5"/>
  <text x="592" y="303" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#1C2B33">Worker 3</text>
  <text x="592" y="322" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" fill="#8A97A0">own context</text>
  <rect x="695" y="276" width="145" height="60" rx="9" fill="#FFFFFF" stroke="#D97740" stroke-width="1.5"/>
  <text x="768" y="303" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#1C2B33">Worker 4</text>
  <text x="768" y="322" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" fill="#8A97A0">own context</text>

  <path d="M 242 336 L 242 354 M 417 336 L 417 354 M 592 336 L 592 354 M 768 336 L 768 354" fill="none" stroke="#D97740" stroke-width="2"/>
  <path d="M 242 354 L 768 354" fill="none" stroke="#D97740" stroke-width="2"/>
  <line x1="505" y1="354" x2="505" y2="376" stroke="#D97740" stroke-width="2" marker-end="url(#dArrow)"/>

  <text x="150" y="410" text-anchor="end" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" font-weight="700" letter-spacing="1.2" fill="#8A97A0">3 · REDUCE</text>
  <rect x="250" y="384" width="510" height="48" rx="9" fill="#F4EFE6" stroke="#C9BFAE" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="505" y="405" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#1C2B33">flatten · dedupe · rank</text>
  <text x="505" y="423" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" fill="#6B5F4E">plain JavaScript. no agent. zero tokens.</text>

  <path d="M 505 432 L 505 444" fill="none" stroke="#D97740" stroke-width="2"/>
  <path d="M 270 444 L 740 444" fill="none" stroke="#D97740" stroke-width="2"/>
  <line x1="270" y1="444" x2="270" y2="462" stroke="#D97740" stroke-width="2" marker-end="url(#dArrow)"/>
  <line x1="505" y1="444" x2="505" y2="462" stroke="#D97740" stroke-width="2" marker-end="url(#dArrow)"/>
  <line x1="740" y1="444" x2="740" y2="462" stroke="#D97740" stroke-width="2" marker-end="url(#dArrow)"/>

  <text x="150" y="497" text-anchor="end" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" font-weight="700" letter-spacing="1.2" fill="#4A7C59">4 · VERIFY</text>
  <rect x="170" y="470" width="200" height="56" rx="9" fill="#FFFFFF" stroke="#4A7C59" stroke-width="1.5"/>
  <text x="270" y="494" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#1C2B33">Is it correct?</text>
  <text x="270" y="512" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" fill="#8A97A0">skeptic, blank slate</text>
  <rect x="405" y="470" width="200" height="56" rx="9" fill="#FFFFFF" stroke="#4A7C59" stroke-width="1.5"/>
  <text x="505" y="494" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#1C2B33">Is it current?</text>
  <text x="505" y="512" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" fill="#8A97A0">skeptic, blank slate</text>
  <rect x="640" y="470" width="200" height="56" rx="9" fill="#FFFFFF" stroke="#4A7C59" stroke-width="1.5"/>
  <text x="740" y="494" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#1C2B33">Is the source real?</text>
  <text x="740" y="512" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" fill="#8A97A0">skeptic, blank slate</text>

  <path d="M 270 526 L 270 544 M 505 526 L 505 544 M 740 526 L 740 544" fill="none" stroke="#D97740" stroke-width="2"/>
  <path d="M 270 544 L 740 544" fill="none" stroke="#D97740" stroke-width="2"/>
  <line x1="505" y1="544" x2="505" y2="558" stroke="#D97740" stroke-width="2" marker-end="url(#dArrow)"/>

  <text x="150" y="580" text-anchor="end" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" font-weight="700" letter-spacing="1.2" fill="#8A97A0">5 · SYNTHESIZE</text>
  <rect x="330" y="556" width="350" height="34" rx="9" fill="#1C2B33"/>
  <text x="505" y="578" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#FBF7F0">Write the answer from what survived</text>
</svg>
