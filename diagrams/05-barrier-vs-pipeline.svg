<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 470" width="880" height="470" role="img" aria-label="Timeline diagram comparing a barrier, where every item waits for the slowest first stage before any second stage begins, against a pipeline, where each item flows through both stages independently and finishes sooner.">
  <rect x="0" y="0" width="880" height="470" rx="14" fill="#FBF7F0"/>
  <rect x="0.75" y="0.75" width="878.5" height="468.5" rx="13.5" fill="none" stroke="#E5DDD0" stroke-width="1.5"/>

  <text x="40" y="52" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="24" font-weight="700" fill="#1C2B33">Barrier vs Pipeline</text>
  <rect x="40" y="64" width="64" height="4" rx="2" fill="#D97740"/>
  <text x="40" y="92" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#5B6B75">Identical work, identical agents. The only difference is whether stage two is allowed to start early.</text>

  <text x="40" y="128" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" letter-spacing="1" fill="#B4483C">BARRIER</text>
  <text x="120" y="128" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="11" fill="#8A97A0">parallel(...) then parallel(...)</text>

  <text x="190" y="166" text-anchor="end" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" fill="#5B6B75">Item A</text>
  <rect x="200" y="150" width="320" height="26" rx="5" fill="#F3DCC9" stroke="#D97740" stroke-width="1.2"/>
  <text x="360" y="167" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" fill="#8A5A33">research</text>
  <rect x="520" y="150" width="80" height="26" rx="5" fill="#DCE6EE" stroke="#3D6B8C" stroke-width="1.2"/>

  <text x="190" y="202" text-anchor="end" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" fill="#5B6B75">Item B</text>
  <rect x="200" y="186" width="80" height="26" rx="5" fill="#F3DCC9" stroke="#D97740" stroke-width="1.2"/>
  <rect x="280" y="186" width="240" height="26" rx="5" fill="#EDE7DC" stroke="#CFC5B4" stroke-width="1.2" stroke-dasharray="5 4"/>
  <text x="400" y="203" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" fill="#9A8F7C">idle, waiting on A</text>
  <rect x="520" y="186" width="320" height="26" rx="5" fill="#DCE6EE" stroke="#3D6B8C" stroke-width="1.2"/>
  <text x="680" y="203" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" fill="#2C5673">verify</text>

  <text x="190" y="238" text-anchor="end" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" fill="#5B6B75">Item C</text>
  <rect x="200" y="222" width="120" height="26" rx="5" fill="#F3DCC9" stroke="#D97740" stroke-width="1.2"/>
  <rect x="320" y="222" width="200" height="26" rx="5" fill="#EDE7DC" stroke="#CFC5B4" stroke-width="1.2" stroke-dasharray="5 4"/>
  <text x="420" y="239" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" fill="#9A8F7C">idle, waiting on A</text>
  <rect x="520" y="222" width="120" height="26" rx="5" fill="#DCE6EE" stroke="#3D6B8C" stroke-width="1.2"/>

  <line x1="520" y1="140" x2="520" y2="258" stroke="#B4483C" stroke-width="2" stroke-dasharray="5 4"/>
  <text x="520" y="272" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" font-weight="600" fill="#B4483C">the barrier</text>

  <line x1="840" y1="140" x2="840" y2="248" stroke="#B4483C" stroke-width="2"/>
  <rect x="742" y="118" width="98" height="22" rx="11" fill="#F7E7E5"/>
  <text x="791" y="133" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" font-weight="700" fill="#B4483C">done at 16</text>

  <line x1="40" y1="296" x2="840" y2="296" stroke="#EFE8DC" stroke-width="1.5"/>

  <text x="40" y="330" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" letter-spacing="1" fill="#4A7C59">PIPELINE</text>
  <text x="122" y="330" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="11" fill="#8A97A0">pipeline(items, stage1, stage2)</text>

  <text x="190" y="368" text-anchor="end" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" fill="#5B6B75">Item A</text>
  <rect x="200" y="352" width="320" height="26" rx="5" fill="#F3DCC9" stroke="#D97740" stroke-width="1.2"/>
  <text x="360" y="369" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" fill="#8A5A33">research</text>
  <rect x="520" y="352" width="80" height="26" rx="5" fill="#DCE6EE" stroke="#3D6B8C" stroke-width="1.2"/>

  <text x="190" y="404" text-anchor="end" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" fill="#5B6B75">Item B</text>
  <rect x="200" y="388" width="80" height="26" rx="5" fill="#F3DCC9" stroke="#D97740" stroke-width="1.2"/>
  <rect x="280" y="388" width="320" height="26" rx="5" fill="#DCE6EE" stroke="#3D6B8C" stroke-width="1.2"/>
  <text x="440" y="405" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" fill="#2C5673">verify starts immediately</text>

  <text x="190" y="440" text-anchor="end" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" fill="#5B6B75">Item C</text>
  <rect x="200" y="424" width="120" height="26" rx="5" fill="#F3DCC9" stroke="#D97740" stroke-width="1.2"/>
  <rect x="320" y="424" width="120" height="26" rx="5" fill="#DCE6EE" stroke="#3D6B8C" stroke-width="1.2"/>
  <text x="470" y="441" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" fill="#4A7C59">C is already finished</text>

  <line x1="600" y1="342" x2="600" y2="450" stroke="#4A7C59" stroke-width="2"/>
  <rect x="504" y="320" width="96" height="22" rx="11" fill="#E8F0E9"/>
  <text x="552" y="335" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" font-weight="700" fill="#4A7C59">done at 10</text>

  <line x1="600" y1="450" x2="840" y2="450" stroke="#4A7C59" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="720" y="443" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" font-weight="600" fill="#4A7C59">37% of the wall clock, gone</text>
</svg>
