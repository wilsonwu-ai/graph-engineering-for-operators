<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 390" width="880" height="390" role="img" aria-label="Decision diagram: if you cannot find two jobs with no edge between them, use a loop. If the work is not wide enough to pay for coordination, use a single agent. Only build a graph when both answers are yes.">
  <defs>
    <marker id="fArrow" viewBox="0 0 12 12" refX="9" refY="6" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 1 L 11 6 L 0 11 z" fill="#8A97A0"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="880" height="390" rx="14" fill="#FBF7F0"/>
  <rect x="0.75" y="0.75" width="878.5" height="388.5" rx="13.5" fill="none" stroke="#E5DDD0" stroke-width="1.5"/>

  <text x="40" y="52" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="24" font-weight="700" fill="#1C2B33">Do You Even Need One?</text>
  <rect x="40" y="64" width="64" height="4" rx="2" fill="#D97740"/>
  <text x="40" y="92" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#5B6B75">A graph buys width. It does not buy judgment. Two gates before you spend anything.</text>

  <rect x="40" y="150" width="150" height="56" rx="10" fill="#FFFFFF" stroke="#E5DDD0" stroke-width="1.5"/>
  <text x="115" y="173" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#1C2B33">The job in</text>
  <text x="115" y="191" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#1C2B33">front of you</text>
  <line x1="190" y1="178" x2="208" y2="178" stroke="#8A97A0" stroke-width="2" marker-end="url(#fArrow)"/>

  <path d="M 300 123 L 390 178 L 300 233 L 210 178 Z" fill="#FFFFFF" stroke="#D97740" stroke-width="1.5"/>
  <text x="300" y="172" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#1C2B33">Two jobs with</text>
  <text x="300" y="190" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#1C2B33">no edge?</text>

  <line x1="390" y1="178" x2="468" y2="178" stroke="#8A97A0" stroke-width="2" marker-end="url(#fArrow)"/>
  <text x="429" y="169" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" font-weight="700" fill="#4A7C59">YES</text>

  <line x1="300" y1="233" x2="300" y2="278" stroke="#8A97A0" stroke-width="2" marker-end="url(#fArrow)"/>
  <text x="312" y="258" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" font-weight="700" fill="#B4483C">NO</text>
  <rect x="215" y="284" width="170" height="52" rx="10" fill="#F4EFE6" stroke="#CFC5B4" stroke-width="1.5"/>
  <text x="300" y="306" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#1C2B33">Use a loop</text>
  <text x="300" y="324" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11.5" fill="#6B5F4E">one agent, steered by you</text>

  <path d="M 560 123 L 650 178 L 560 233 L 470 178 Z" fill="#FFFFFF" stroke="#D97740" stroke-width="1.5"/>
  <text x="560" y="172" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#1C2B33">Wide enough to</text>
  <text x="560" y="190" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#1C2B33">pay for it?</text>

  <line x1="650" y1="178" x2="712" y2="178" stroke="#8A97A0" stroke-width="2" marker-end="url(#fArrow)"/>
  <text x="681" y="169" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" font-weight="700" fill="#4A7C59">YES</text>

  <line x1="560" y1="233" x2="560" y2="278" stroke="#8A97A0" stroke-width="2" marker-end="url(#fArrow)"/>
  <text x="572" y="258" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" font-weight="700" fill="#B4483C">NO</text>
  <rect x="475" y="284" width="170" height="52" rx="10" fill="#F4EFE6" stroke="#CFC5B4" stroke-width="1.5"/>
  <text x="560" y="306" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#1C2B33">Single agent</text>
  <text x="560" y="324" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11.5" fill="#6B5F4E">cheaper and faster</text>

  <rect x="718" y="148" width="122" height="60" rx="10" fill="#1C2B33"/>
  <text x="779" y="173" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#FBF7F0">Build the</text>
  <text x="779" y="191" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#FBF7F0">graph</text>

  <text x="748" y="290" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11.5" fill="#5B6B75">Start scoped. Cap the</text>
  <text x="748" y="308" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11.5" fill="#5B6B75">first run. Watch what it</text>
  <text x="748" y="326" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11.5" fill="#5B6B75">costs. Then widen.</text>

  <line x1="40" y1="352" x2="840" y2="352" stroke="#EFE8DC" stroke-width="1.5"/>
  <text x="40" y="374" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12.5" fill="#5B6B75">The tell: if you cannot find two jobs with no edge between them, there is no graph to build. It is a loop, and a loop is fine.</text>
</svg>
